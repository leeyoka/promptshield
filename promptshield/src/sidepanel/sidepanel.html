<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptShield</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <span class="brand-icon" id="brand-icon"></span>
    <div>
      <h1>PromptShield <span class="ver tnum" id="version"></span></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
  </header>

  <main>
    <!-- 1. Mask before sharing -->
    <section aria-labelledby="h-input">
      <div class="step-head">
        <span class="step-num">1</span>
        <h2 id="h-input" data-i18n="inputTitle"></h2>
      </div>
      <textarea id="input" rows="7" spellcheck="false"></textarea>
      <div class="row-meta">
        <span class="muted small tnum" id="char-count"></span>
        <span class="spacer"></span>
        <button type="button" class="btn-text" id="btn-sample" data-i18n="sample"></button>
        <button type="button" class="btn-text" id="btn-clear" data-i18n="clear"></button>
      </div>

      <div id="detect" hidden>
        <div class="list-head"><span data-i18n="detected"></span> <span class="tnum" id="det-count">0</span></div>
        <ul class="list" id="list"></ul>
      </div>
      <p class="empty muted" id="empty" hidden data-i18n="noneFound"></p>

      <div id="preview-wrap" hidden>
        <div class="seg" role="tablist">
          <button type="button" role="tab" data-view="original" aria-selected="false" data-i18n="viewOriginal"></button>
          <button type="button" role="tab" data-view="safe" aria-selected="true" data-i18n="viewSafe"></button>
        </div>
        <div class="preview" id="preview" tabindex="0" aria-live="polite"></div>
      </div>

      <button type="button" class="btn btn-primary btn-block" id="btn-copy" disabled data-i18n="copySafe"></button>
      <p class="status small" id="copy-status" aria-live="polite"></p>

      <div class="advice" id="advice" hidden></div>
    </section>

    <!-- 2. Restore the AI's reply -->
    <section aria-labelledby="h-reply">
      <div class="step-head">
        <span class="step-num">2</span>
        <h2 id="h-reply" data-i18n="replyTitle"></h2>
      </div>
      <p class="hint muted small" data-i18n="replyHint"></p>
      <textarea id="reply" rows="5" spellcheck="false"></textarea>
      <div id="restored-wrap" hidden>
        <div class="list-head"><span data-i18n="restoredTitle"></span> <span class="tnum" id="restored-count"></span></div>
        <pre class="preview" id="restored"></pre>
        <button type="button" class="btn btn-secondary btn-block" id="btn-copy-restored" data-i18n="copyRestored"></button>
        <p class="status small" id="restore-status" aria-live="polite"></p>
      </div>
    </section>

    <p class="foot" data-i18n="foot"></p>
  </main>

  <script src="../shared/constants.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/ui-tokens.js"></script>
  <script src="../shared/detectors.js"></script>
  <script src="../shared/complexity.js"></script>
  <script src="../shared/restorer.js"></script>
  <script src="../shared/masker.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
